services:

  postgres:
    image: postgres:15-alpine
    container_name: reservas_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - reservas_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: reservas_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST:     postgres
      DB_NAME:     ${DB_NAME}
      DB_PORT:     ${DB_PORT:-5432}
    networks:
      - reservas_net
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  reservas_net:
    driver: bridge
